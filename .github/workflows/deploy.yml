name: Deploy to GitHub Pages

# The repository IS the site: there is no build step, no Node, no bundler.
# This workflow validates the content, stages the publishable files into
# _site/, and hands that folder to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate course.json and content
        run: python3 tools/check.py

      - name: Stage the site
        # Everything except the repository's own tooling. CNAME and .nojekyll
        # are deliberately kept: CNAME binds the custom domain, .nojekyll tells
        # Pages to publish the files verbatim. The bare 'README.md' pattern
        # matches at every level, so slides/README.md — instructor notes, not
        # student material — stays out of the published site too.
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'tools/' \
            --exclude 'Makefile' \
            --exclude 'README.md' \
            --exclude '.gitignore'
          echo "Staged files:"
          find _site -maxdepth 2 -printf '%P\n' | sort

      - name: Withhold unpublished session material
        # course.json `published` lists the sessions students may reach. The
        # site hides the rest, but hiding is not withholding: this deletes
        # their notes and files from the staged copy so no direct URL reaches
        # them. It touches _site/ only; the repository keeps every file.
        run: python3 tools/prune.py _site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
