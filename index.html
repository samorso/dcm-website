  <!-- Resolve the appearance preference before first paint (no flash).
       `data-theme` holds the RESOLVED theme (light|dark) that CSS reads;
       `data-theme-pref` holds what the reader chose (light|dark|system). -->
  <script>
    (function () {
      var pref = "system";
      try { pref = localStorage.getItem("dcm-theme") || "system"; } catch (e) {}
      if (pref !== "light" && pref !== "dark") pref = "system";
      var dark = pref === "dark" ||
        (pref === "system" && window.matchMedia &&
         window.matchMedia("(prefers-color-scheme: dark)").matches);
      var r = document.documentElement;
      r.setAttribute("data-theme", dark ? "dark" : "light");
      r.setAttribute("data-theme-pref", pref);
    })();
  </script>
